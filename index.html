<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous"
    />

    <title>Mi calculadora</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">CALCULADORA</h1>

      <div id="calculadora" class="mx-auto" style="max-width: 400px;">
        <div id="formulario">
          <!-- Número 1 -->
          <div class="form-group">
            <label for="num1">Número 1</label>
            <input
              type="text"
              class="form-control"
              id="num1"
              placeholder="Ingresa el primer número"
            />
          </div>

          <!-- Número 2 -->
          <div class="form-group">
            <label for="num2">Número 2</label>
            <input
              type="text"
              class="form-control"
              id="num2"
              placeholder="Ingresa el segundo número"
            />
          </div>

          <!-- Operación -->
          <div class="form-group">
            <label for="operacion">Operación</label>
            <select class="form-control" id="operacion">
              <option value="sumar">Sumar</option>
              <option value="restar">Restar</option>
              <option value="multiplicar">Multiplicar</option>
              <option value="dividir">Dividir</option>
            </select>
          </div>

          <!-- Botón calcular -->
          <button id="calcular" class="btn btn-primary btn-block">Calcular</button>

          <!-- Resultado -->
          <div class="mt-3 text-center">
            <strong>Resultado: </strong>
            <span id="resultado">-</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de la calculadora -->
    <script>
      document.getElementById("calcular").addEventListener("click", function () {
        const num1 = parseFloat(document.getElementById("num1").value);
        const num2 = parseFloat(document.getElementById("num2").value);
        const operacion = document.getElementById("operacion").value;
        let resultado = "";

        if (isNaN(num1) || isNaN(num2)) {
          resultado = "Por favor, ingresa números válidos.";
        } else {
          switch (operacion) {
            case "sumar":
              resultado = num1 + num2;
              break;
            case "restar":
              resultado = num1 - num2;
              break;
            case "multiplicar":
              resultado = num1 * num2;
              break;
            case "dividir":
              resultado =
                num2 !== 0 ? num1 / num2 : "No se puede dividir por cero";
              break;
            default:
              resultado = "Operación no válida";
          }
        }

        document.getElementById("resultado").textContent = resultado;
      });
    </script>
  </body>
</html>
